name: Data Pipeline CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Demo Pipeline and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Demo Mode
        run: |
          python -c "import json; from pathlib import Path; config=json.loads(Path('config/pipeline_config.json').read_text(encoding='utf-8')); assert config['pipeline']['mode'].lower() == 'demo', 'CI requires pipeline mode to be demo'; print('Pipeline mode: DEMO')"

      - name: Run end-to-end demo pipeline
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python scripts/05_run_pipeline.py

      - name: Run automated tests
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -p "test_*.py" -v